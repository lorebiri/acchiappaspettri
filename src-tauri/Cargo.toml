[package]
name = "acchiappaspettri"
version = "2.2.0"
description = "Acchiappaspettri: spectra and chromatograms to clean plots and scientific analysis"
authors = ["Lorenzo Birindelli"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "acchiappaspettri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Solo per i collaudi automatici: mai attiva negli installer pubblicati (vedi docs/COLLAUDO.md)
e2e = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
