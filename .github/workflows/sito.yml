# Sito di presentazione e download (scarica/): test a ogni modifica, in un browser vero e con i controlli statici.
#
# La pubblicazione è in pages.yml (app e sito insieme, con la versione dell'ultima release scritta nelle pagine).
# Istruzioni: DEPLOY-SITO.md.
name: Sito
on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
    paths: ["scarica/**", "CHANGELOG.md", "CHANGELOG.en.md", "package.json", "test/unit/sito*.test.js", "test/validation/sito-ui.test.js", "scripts/sito-*", ".github/workflows/sito.yml", ".github/workflows/pages.yml", "index.html", "app/desktop.js", "i18n/en-app.json"]
  pull_request:
    paths: ["scarica/**", "CHANGELOG.md", "CHANGELOG.en.md", "package.json", "test/unit/sito*.test.js", "test/validation/sito-ui.test.js", "scripts/sito-*", ".github/workflows/sito.yml", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sito-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Struttura, link, immagini, nomi di terzi, logica del download, allineamento alla versione
        run: node --test test/unit/sito.test.js test/unit/sito-sync.test.js
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Il sito costruito contiene app e pagine agli indirizzi di sempre
        run: node scripts/sito-verifica.mjs .
      - run: npx playwright install --with-deps chromium
      - name: Nel browser (API di GitHub simulata o assente, JavaScript spento), con gli screenshot desktop e mobile
        run: node --test test/validation/sito-ui.test.js
        env: { SITO_SCREENSHOT: sito-screenshot }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with: { name: sito-screenshot, path: sito-screenshot, retention-days: 14, if-no-files-found: ignore }

