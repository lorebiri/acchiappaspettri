# Pubblicazione: si parte da un tag v1.2.3 (stabile) o v1.2.3-beta.1 (beta).
# Prima i test; poi gli installer in una release in bozza; infine la pubblicazione, solo se ci sono tutti i pacchetti e i metadati.
name: Release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
# due esecuzioni sullo stesso tag (tag cancellato e rifatto) scriverebbero nella stessa bozza: la seconda aspetta
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: node scripts/check-version.js "$GITHUB_REF_NAME"
      - name: La firma degli aggiornamenti è configurata
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: test -n "$KEY" && test -n "$PW" || { echo "Mancano i segreti di firma (docs/PUBBLICARE.md)"; exit 1; }
  draft:
    # tauri-action riusa la prima release con questo tag: una bozza rimasta da un altro commit porterebbe pacchetti e latest.json vecchi
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # le bozze sono visibili solo con il permesso di scrittura
    steps:
      - name: Nessuna release pubblicata o bozza di un altro commit con questo tag
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[]|select(.tag_name==\"$GITHUB_REF_NAME\")|[.id,.draft,.target_commitish]|@tsv" > found.tsv
          cat found.tsv
          n=$(grep -c . found.tsv || true)
          if [ "$n" -gt 1 ]; then echo "::error::$n release con il tag $GITHUB_REF_NAME: ne deve restare al più una (bozza dello stesso commit)"; exit 1; fi
          if [ "$n" = 1 ]; then
            IFS=$'\t' read -r id draft commit < found.tsv
            if [ "$draft" != true ]; then echo "::error::la release $GITHUB_REF_NAME è già pubblicata (id $id): non si ripubblica sopra"; exit 1; fi
            if [ "$commit" != "$GITHUB_SHA" ]; then echo "::error::bozza $id di un altro commit ($commit, tag su $GITHUB_SHA): va cancellata prima di pubblicare"; exit 1; fi
            echo "::notice::bozza $id dello stesso commit: si riprende (nuova esecuzione)"
          fi
  tests:
    needs: check-version
    uses: ./.github/workflows/ci.yml
    with: { native: true }
  build:
    needs: [tests, draft]
    permissions:
      contents: write
    strategy:
      fail-fast: true
      max-parallel: 1   # tauri-action fonde latest.json leggendo e riscrivendo: in parallelo si perderebbe una piattaforma
      matrix:
        include:
          - { os: windows-2025, args: "--bundles nsis" }   # stesse immagini della CI
          - { os: macos-26, args: "--target aarch64-apple-darwin --bundles app,dmg", rust_target: aarch64-apple-darwin }
          - { os: macos-15-intel, args: "--target x86_64-apple-darwin --bundles app,dmg", rust_target: x86_64-apple-darwin }   # compilato su un Mac Intel vero
          # .deb anche per le prove: dopo la compilazione la sua versione Debian diventa «X~rc.N» (scripts/deb-version.js),
          # che dpkg ordina prima della stabile (con «X-rc.N» la stabile sembrerebbe una retrocessione)
          - { os: ubuntu-22.04, args: "--bundles appimage,deb" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { targets: "${{ matrix.rust_target }}" }
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: { workspaces: src-tauri, key: "${{ matrix.rust_target }}" }
      - name: Spotlight spento (macOS)
        # hdiutil non riesce a staccare il disco temporaneo del DMG («Resource busy») se Spotlight lo sta indicizzando
        if: startsWith(matrix.os, 'macos')
        run: sudo mdutil -a -i off || true
      - name: Librerie di sistema (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev
      - run: npm ci
      - uses: ./.github/actions/tauri-tools
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Acchiappaspettri ${{ github.ref_name }}
          releaseBody: "Note di rilascio in preparazione."
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}
          # come in ci.yml: nuovi tentativi solo per hdiutil «Resource busy» e download falliti per la rete, con ::warning::
          # (retryAttempts di tauri-action ripete qualsiasi errore senza avviso: non si usa)
          tauriScript: node .github/scripts/tauri-build.js
      - name: Versione Debian delle prove (X~rc.N) nel .deb (Linux)
        if: startsWith(matrix.os, 'ubuntu') && contains(github.ref_name, '-')
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -e
          deb=$(ls src-tauri/target/release/bundle/deb/*.deb)
          node scripts/deb-version.js "$deb" "$GITHUB_REF_NAME"
          dpkg-deb -I "$deb" > /dev/null && dpkg-deb -c "$deb" > /dev/null
          # il pacchetto è cambiato: la firma va rifatta (il .deb non entra in latest.json, ma la firma pubblicata deve essere vera)
          up=("$deb"); if [ -f "$deb.sig" ]; then rm "$deb.sig"; npx tauri signer sign "$deb"; up+=("$deb.sig"); fi
          gh release upload "$GITHUB_REF_NAME" "${up[@]}" --clobber
      - name: Librerie Ubuntu incluse nell'AppImage (per l'offerta del codice sorgente LGPL)
        if: startsWith(matrix.os, 'ubuntu')
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          set -e
          # solo le librerie davvero copiate nell'AppImage, ciascuna ricondotta al suo pacchetto con dpkg -S
          ai=$(realpath src-tauri/target/release/bundle/appimage/*.AppImage); x=$(mktemp -d)
          chmod +x "$ai"; (cd "$x" && "$ai" --appimage-extract > /dev/null)
          node scripts/linux-libs-tsv.js "$x/squashfs-root" > librerie-linux-ubuntu-22.04.tsv
          head -3 librerie-linux-ubuntu-22.04.tsv; wc -l librerie-linux-ubuntu-22.04.tsv
          gh release upload "$GITHUB_REF_NAME" librerie-linux-ubuntu-22.04.tsv --clobber
      - name: Controlla i pacchetti che verranno pubblicati
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: present
          EXPECT_ARCH: ${{ matrix.rust_target == 'x86_64-apple-darwin' && 'x86_64' || (matrix.rust_target == 'aarch64-apple-darwin' && 'arm64' || '') }}
        run: node scripts/check-packages.js
      - name: Installa, avvia e disinstalla l'installer che verrà pubblicato (Windows)
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: ./scripts/windows-install-test.ps1 src-tauri/target/release/bundle/nsis
  publish:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Controlla i pacchetti, scrive le note e pubblica
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: node scripts/publish-release.js "$GITHUB_REF_NAME"
