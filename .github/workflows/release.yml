# Pubblicazione: si parte da un tag v1.2.3 (stabile) o v1.2.3-beta.1 (beta).
# Prima i test; poi gli installer in una release in bozza; infine la pubblicazione, solo se ci sono tutti i pacchetti e i metadati.
name: Release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
jobs:
  check-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: node scripts/check-version.js "$GITHUB_REF_NAME"
      - name: La firma degli aggiornamenti è configurata
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: test -n "$KEY" && test -n "$PW" || { echo "Mancano i segreti di firma (docs/PUBBLICARE.md)"; exit 1; }
  tests:
    needs: check-version
    uses: ./.github/workflows/ci.yml
    with: { native: true }
    secrets: inherit
  build:
    needs: tests
    permissions:
      contents: write
    strategy:
      fail-fast: true
      max-parallel: 1   # tauri-action fonde latest.json leggendo e riscrivendo: in parallelo si perderebbe una piattaforma
      matrix:
        include:
          - { os: windows-latest, args: "--bundles nsis" }
          - { os: macos-latest, args: "--target aarch64-apple-darwin --bundles app,dmg", rust_target: aarch64-apple-darwin }
          - { os: macos-15-intel, args: "--target x86_64-apple-darwin --bundles app,dmg", rust_target: x86_64-apple-darwin }   # compilato su un Mac Intel vero
          - { os: ubuntu-22.04, args: "--bundles appimage,deb" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { targets: "${{ matrix.rust_target }}" }
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: { workspaces: src-tauri, key: "${{ matrix.rust_target }}" }
      - name: Spotlight spento (macOS)
        # hdiutil non riesce a staccare il disco temporaneo del DMG («Resource busy») se Spotlight lo sta indicizzando
        if: startsWith(matrix.os, 'macos')
        run: sudo mdutil -a -i off || true
      - name: Librerie di sistema (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev
      - run: npm ci
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Acchiappaspettri ${{ github.ref_name }}
          releaseBody: "Note di rilascio in preparazione."
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}
      - name: Versioni delle librerie Ubuntu incluse nell'AppImage (per l'offerta del codice sorgente LGPL)
        if: startsWith(matrix.os, 'ubuntu')
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          dpkg-query -W -f='${Package}\t${Version}\t${source:Package}\t${source:Version}\n' | sort > librerie-linux-ubuntu-22.04.tsv
          gh release upload "$GITHUB_REF_NAME" librerie-linux-ubuntu-22.04.tsv --clobber
      - name: Controlla i pacchetti che verranno pubblicati
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: present
          EXPECT_ARCH: ${{ matrix.rust_target == 'x86_64-apple-darwin' && 'x86_64' || (matrix.rust_target == 'aarch64-apple-darwin' && 'arm64' || '') }}
        run: node scripts/check-packages.js
      - name: Installa, avvia e disinstalla l'installer che verrà pubblicato (Windows)
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: ./scripts/windows-install-test.ps1 src-tauri/target/release/bundle/nsis
  publish:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Controlla i pacchetti, scrive le note e pubblica
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: node scripts/publish-release.js "$GITHUB_REF_NAME"
