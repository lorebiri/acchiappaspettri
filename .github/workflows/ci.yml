# Test a ogni modifica. Compilazione e collaudo nativo sui tre sistemi per il ramo desktop e su richiesta.
name: CI
on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      native: { type: boolean, default: true }
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !inputs.native }}
jobs:
  web-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node scripts/check-version.js
      - name: Il dizionario generato è aggiornato
        run: node scripts/i18n-build.js && git diff --exit-code i18n/en.js
      - name: Test unitari (scienza, formato, lingue, configurazione)
        run: npm test
      - name: Benchmark scientifici
        run: N=20 npm run test:benchmarks
      - run: npx playwright install --with-deps chromium
      - name: Collaudo dell'interfaccia in italiano e inglese
        run: npm run test:ui
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: i18n-missing, path: test/i18n-missing.json, if-no-files-found: ignore }
  native:
    if: inputs.native || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/desktop'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, name: linux }
          - { os: windows-latest, name: windows }
          - { os: macos-latest, name: macos }
          - { os: macos-15-intel, name: macos-intel }   # Mac Intel (x86_64): compilato e provato nativamente
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Librerie di sistema (Linux)
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev xvfb
      - run: npm ci
      - run: node scripts/prepare-desktop.js
      - name: Test del codice nativo (non su Windows, tauri#13419; lì vale il collaudo dentro l'app)
        if: matrix.name != 'windows'
        run: cargo test --manifest-path src-tauri/Cargo.toml
        shell: bash
      - name: Compila l'app di collaudo
        shell: bash
        run: |
          ACCH_E2E_PAGE=1 npx tauri build --debug --features e2e --no-bundle
      - name: Collaudo dentro l'app vera (Linux)
        if: matrix.name == 'linux'
        run: xvfb-run -a node test/e2e/run-e2e.js src-tauri/target/debug/acchiappaspettri full
      - name: Collaudo dentro l'app vera (Windows)
        if: matrix.name == 'windows'
        run: node test/e2e/run-e2e.js src-tauri/target/debug/acchiappaspettri.exe full
      - name: Collaudo dentro l'app vera (macOS)
        if: startsWith(matrix.name, 'macos')
        run: node test/e2e/run-e2e.js src-tauri/target/debug/acchiappaspettri full
      - name: Costruisce gli installer veri e li controlla
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # senza il segreto (prima configurazione, rami di altri) si costruisce senza i file per l'updater
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'; else npx tauri build; fi
          node scripts/check-packages.js
      - name: Installa, avvia e disinstalla l'installer vero (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Write-Host "Installer: $($exe.Name)"
          Start-Process $exe.FullName -ArgumentList '/S' -Wait
          $cands = @("$env:LOCALAPPDATA\Acchiappaspettri", "$env:LOCALAPPDATA\Programs\Acchiappaspettri")
          $dir = $cands | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $dir) { throw "non installato in $($cands -join ', ')" }
          $app = Get-ChildItem $dir -Filter *.exe | Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          Write-Host "Installato in $dir : $($app.Name)"
          $lnk = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter *.lnk | Where-Object { $_.Name -match 'Acchiappaspettri' }
          if (-not $lnk) { throw 'manca la voce nel menu Start' }
          $p = Start-Process $app.FullName -PassThru; Start-Sleep 20
          if ($p.HasExited) { throw "l'app si è chiusa all'avvio (codice $($p.ExitCode))" }
          Write-Host 'Avviata e ancora aperta dopo 20 s'
          Stop-Process $p.Id -Force; Start-Sleep 3
          Start-Process (Join-Path $dir 'uninstall.exe') -ArgumentList '/S' -Wait; Start-Sleep 8
          if (Test-Path $app.FullName) { throw 'disinstallazione incompleta' }
          Write-Host 'Disinstallata'
      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.name }}
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
