# Test a ogni modifica. Compilazione e collaudo nativo sui tre sistemi per il ramo desktop e su richiesta.
name: CI
on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
    # i soli documenti non fanno girare la CI, tranne CHANGELOG.md (lo leggono check-version.js e la pubblicazione)
    # e THIRD-PARTY-NOTICES.md (va dentro i pacchetti, che check-packages.js controlla)
    paths: ["**", "!**.md", "!docs/**", "CHANGELOG.md", "THIRD-PARTY-NOTICES.md"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      native: { type: boolean, default: true }
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !inputs.native }}
jobs:
  web-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node scripts/check-version.js
      - name: Il dizionario generato è aggiornato
        run: node scripts/i18n-build.js && git diff --exit-code i18n/en.js
      - name: Test unitari (scienza, formato, lingue, configurazione)
        run: npm test
      - name: Benchmark scientifici
        run: N=20 npm run test:benchmarks
      - name: Validazione numerica (NIST StRD, statistica, deconvoluzione, file avversi, casi limite, riferimenti)
        run: npm run test:validation
      - name: Rapporto di validazione
        run: npm run validazione
      - run: npx playwright install --with-deps chromium
      - name: Collaudo dell'interfaccia in italiano e inglese
        run: npm run test:ui
      - name: Validazione nell'interfaccia (file avversi ed esportazioni)
        run: npm run test:validation:ui
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with: { name: validazione, path: docs/VALIDAZIONE.md }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with: { name: i18n-missing, path: test/i18n-missing.json, if-no-files-found: ignore }
  tauri-tools:
    # strumenti del bundler in cache anche sui rami dove «native» non gira (main): la cache di main è visibile ai tag della pubblicazione
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-22.04, windows-2025] }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/tauri-tools
  native:
    # anche sui rami rc/* delle release candidate (prima saltava: run 42464740118)
    if: inputs.native || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/desktop' || startsWith(github.ref, 'refs/heads/rc/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, name: linux }
          - { os: windows-2025, name: windows }   # immagini fissate (non -latest): CI e pubblicazione sulla stessa macchina
          - { os: macos-26, name: macos }
          - { os: macos-15-intel, name: macos-intel }   # Mac Intel (x86_64): compilato e provato nativamente
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: { workspaces: src-tauri }
      - name: Spotlight spento (macOS)
        # hdiutil non riesce a staccare il disco temporaneo del DMG («Resource busy») se Spotlight lo sta indicizzando
        if: startsWith(matrix.name, 'macos')
        run: sudo mdutil -a -i off || true
      - name: Librerie di sistema (Linux)
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev xvfb
      - run: npm ci
      - uses: ./.github/actions/tauri-tools
      - run: node scripts/prepare-desktop.js
      - name: Test del codice nativo (non su Windows, tauri#13419; lì vale il collaudo dentro l'app)
        if: matrix.name != 'windows'
        run: cargo test --manifest-path src-tauri/Cargo.toml
        shell: bash
      - name: Compila l'app di collaudo
        shell: bash
        run: |
          ACCH_E2E_PAGE=1 npx tauri build --debug --features e2e --no-bundle
      - name: Collaudo dentro l'app vera (Linux)
        if: matrix.name == 'linux'
        run: xvfb-run -a node test/e2e/run-e2e.js src-tauri/target/debug/acchiappaspettri full
          node test/e2e/run-e2e.js src-tauri/target/debug/acchiappaspettri apri-grezzi
          xvfb-run -a node test/e2e/run-e2e.js src-tauri/target/debug/acchiappaspettri apri-grezzi
      - name: Collaudo dentro l'app vera (Windows)
        if: matrix.name == 'windows'
        run: node test/e2e/run-e2e.js src-tauri/target/debug/acchiappaspettri.exe full
          node test/e2e/run-e2e.js src-tauri/target/debug/acchiappaspettri.exe apri-grezzi
      - name: Collaudo dentro l'app vera (macOS)
        if: startsWith(matrix.name, 'macos')
        run: node test/e2e/run-e2e.js src-tauri/target/debug/acchiappaspettri full
      - name: Costruisce gli installer veri e li controlla
        shell: bash
        # niente chiave di firma qui: la CI gira su ogni ramo e non pubblica; i pacchetti firmati si costruiscono e controllano in release.yml
        # nuovi tentativi solo per gli errori passeggeri noti (hdiutil «Resource busy», download falliti per la rete), con ::warning::
        run: |
          node .github/scripts/tauri-build.js build --config '{"bundle":{"createUpdaterArtifacts":false}}'
          node scripts/check-packages.js
      - name: Installa, avvia e disinstalla l'installer vero (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: ./scripts/windows-install-test.ps1 src-tauri/target/release/bundle/nsis
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: installer-${{ matrix.name }}
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
